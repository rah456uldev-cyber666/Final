<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Medibot: medical questions, disease library, symptom checker and emergency help, online and offline">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Medibot">
  <title>Medibot</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body class="no-tabs">
  <div class="splash" id="splash"><img src="icons/logo-full.png" alt="MediBot"></div>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/home"><img src="icons/mark.png" alt=""><span><b class="g">Medi</b><b class="n">Bot</b></span></a>
    <div class="top-actions">
      <button id="status" class="status" type="button" title="Online / offline mode"></button>
      <button id="sosTop" class="sos-mini" type="button" title="Call 108 ambulance">SOS</button>
    </div>
  </header>
  <nav class="tabbar" id="tabbar" hidden></nav>
  <main id="view" class="container" aria-live="polite"></main>
  <noscript>Medibot needs JavaScript to run.</noscript>
  <script src="config.js"></script>
  <script src="data/diseases.js"></script>
  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/search.js"></script>
  <script src="js/answer.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
